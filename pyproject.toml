[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyt-ng"
version = "0.1.0"
description = "Chasing Your Tail NG — headless EDC personal SIGINT platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28.0",
  "cryptography>=40.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.4.0"]

[project.scripts]
# `cyt-analyzer` is the historical name; `cyt` is the short operator form
# used throughout the docs (README, FIELD_DEPLOY). Both run the same entry.
cyt = "cyt_platform.__main__:main"
cyt-analyzer = "cyt_platform.__main__:main"

[tool.setuptools.packages.find]
include = ["cyt_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Lint gate is scoped to the platform package and its tests. Legacy root-level
# tools are quarantined later in the trustworthiness build and are deliberately
# out of the gate until then.
include = ["cyt_platform/**/*.py", "tests/**/*.py"]
# Python 3.9 is the supported floor (requires-python); pin it so ruff never
# suggests 3.10+ syntax on hot paths.
target-version = "py39"

[tool.ruff.lint]
# Pin ruff's documented default rule set (pycodestyle errors + pyflakes)
# explicitly so CI is deterministic across ruff releases; broader categories
# (pyupgrade, flake8-*, etc.) are opt-in later, not ruff-default drift.
select = ["E4", "E7", "E9", "F"]
