[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyt-ng"
version = "0.1.0"
description = "Chasing Your Tail NG — headless EDC personal SIGINT platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28.0",
  "cryptography>=40.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
cyt-analyzer = "cyt_platform.__main__:main"

[tool.setuptools.packages.find]
include = ["cyt_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
